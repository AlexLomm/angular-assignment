<main class="main">
  <ng-container *ngIf="isLoading; else profiles">
    <h1>Loading...</h1>
  </ng-container>
</main>

<ng-template #profiles>
  <app-card
    *ngFor="let card of data"
    [firstName]="card.firstName"
    [lastName]="card.lastName"
    [age]="card.age"
    [imageSrc]="card.imageSrc"
  ></app-card>
</ng-template>
